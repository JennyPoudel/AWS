AWSTemplateFormatVersion: 2010-09-09
Description: create a role for us to assume and create a resource that we will have access to
Parameters:
  BucketName:
    Type: String
    Description: The name of the bucket to create
    Default: jp-sts-example-380301679044
Resources:
  S3Bucket:
   Type: 'AWS::S3::Bucket'
   Properties:
    BucketName: !Ref BucketName
  StsRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: arn:aws:iam::380301679044:user/machine-u
            Action:
              - 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: S3access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: 's3:*'
                Resource: [!Sub 'arn:aws:s3:::*',!Sub 'arn:aws:s3:::${BucketName}/*', !Sub 'arn:aws:s3:::${BucketName}']
  